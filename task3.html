<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Bootstrap Validation Styles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
      <h2 class="mb-4 text-center">Task 3 - Bootstrap Validation Styles</h2>    
      <form id="task3Form" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" required minlength="2" placeholder="Enter your name">
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Name is required (at least 2 characters).</div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required placeholder="name@example.com">
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="3" required placeholder="Write your message..."></textarea>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Message cannot be empty.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Submit</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('task3Form');
    const inputs = form.querySelectorAll('input, textarea');
    function validateField(input) {
      if (input.checkValidity()) {
        input.classList.remove('is-invalid');
        input.classList.add('is-valid');
      } else {
        input.classList.remove('is-valid');
        input.classList.add('is-invalid');
      }
    }
    inputs.forEach(input => {
      input.addEventListener('input', () => validateField(input));
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      inputs.forEach(input => validateField(input));
    });
  </script>
</body>
</html>
