<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - HTML5 Validation</title>
</head>
<body>

  <h2>Task 1 - Form with HTML5 Validation</h2>

  <form>
    <div>
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required minlength="2" maxlength="30">
    </div>
    <br>
    <div>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required>
    </div>
    <br>
    <div>
      <label for="message">Message:</label><br>
      <textarea id="message" name="message" rows="4" required minlength="10" maxlength="200"></textarea>
    </div>
    <br>
    <button type="submit">Submit</button>
  </form>

</body>
</html>
